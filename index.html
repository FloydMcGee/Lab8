<!DOCTYPE html>
<html>
<head>
    <title>Lab 8</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          crossorigin=""/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            crossorigin=""></script>

    <script src="https://cdn.jsdelivr.net/gh/digidem/leaflet-side-by-side@2.2.0/leaflet-side-by-side.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            height: 100%;
            width: 100%;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <script>

        var map = L.map('map', {
            center: [41.65, -87.79],
            zoom: 7,
            minZoom: 5
        });

        var Night_Light = L.tileLayer.wms(
            'https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi?', 
            {
                layers: 'VIIRS_BLACK_MARBLE',
                format: 'image/png',
                transparent: true,
                opacity: 0.6,
                attribution: 'Imagery courtesy of NASA EOSDIS GIBS',
                maxZoom: 9
            }).addTo(map);

       var Esri_WorldImagery =L.tileLayer(
           'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', 
           {
               attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
               maxZoom: 9
           }).addTo(map);

        var slider = L.control.sideBySide(
            Night_Light, Esri_WorldImagery
        ).addTo(map);

        slider._range.addEventListener('mouseover', function () {
            map.dragging.disable();
        });

        slider._range.addEventListener('mouseout', function () {
            map.dragging.enable();
        });
    </script>
</body>
</html>
